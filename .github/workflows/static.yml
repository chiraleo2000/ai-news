# Deploy ONLY the public site tree to GitHub Pages.
# Uploading the whole repo (Document/*.pdf, News/, github-pages mirror, etc.)
# made deploy-pages hang on syncing_files until the hard 10-minute timeout —
# so today's news could be on master but never go live.
name: Deploy static content to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  # Cancel a stuck/superseded deploy so the latest push can go live
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build slim site artifact
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -a index.html .nojekyll _site/
          cp -a assets js data _site/
          echo "Site artifact contents:"
          find _site -type f | wc -l
          du -sh _site _site/data

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
